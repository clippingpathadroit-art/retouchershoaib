<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" role="img" aria-label="Step 2 inside neck diagram showing top mannequin neck piece removed cleanly to capture the inner back collar and woven brand label at the same tripod height">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17171b"/>
      <stop offset="100%" stop-color="#0d0d10"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.34" r="0.38">
      <stop offset="0%" stop-color="#c8f135" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#c8f135" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg2)"/>
  <rect width="600" height="750" fill="url(#glow2)"/>

  <!-- Technical Grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5">
    <line x1="0" y1="187" x2="600" y2="187"/>
    <line x1="0" y1="375" x2="600" y2="375"/>
    <line x1="0" y1="562" x2="600" y2="562"/>
    <line x1="150" y1="0" x2="150" y2="750"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="450" y1="0" x2="450" y2="750"/>
  </g>

  <!-- Large Legible Step Badge -->
  <rect x="28" y="28" width="224" height="60" rx="30" fill="#c8f135" fill-opacity="0.14" stroke="#c8f135" stroke-width="2.5"/>
  <text x="140" y="71" text-anchor="middle" fill="#c8f135" font-family="'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="1">SHOT 02</text>

  <!-- Top Mannequin Neck Piece Lifted Up & Removed -->
  <g>
    <path d="M250 116 C250 92 350 92 350 116 L356 164 L244 164 Z" fill="none" stroke="#b0b0a8" stroke-width="3" stroke-dasharray="7 6" opacity="0.75"/>
    <line x1="300" y1="172" x2="300" y2="210" stroke="#c8f135" stroke-width="4" stroke-linecap="round"/>
    <polyline points="284,188 300,170 316,188" fill="none" stroke="#c8f135" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Outer Garment Body (Dimmed so Focus Highlights Neck Cavity) -->
  <path d="M242 226 L138 260 L92 554 L156 562 L188 358 L188 614 L412 614 L412 358 L444 562 L508 554 L462 260 L358 226" fill="#181920" stroke="#7c7c77" stroke-width="3" stroke-linejoin="round"/>

  <!-- Highlighted Exposed Interior Collar & Brand Label -->
  <g>
    <path d="M242 226 C266 198 334 198 358 226 L342 406 L300 472 L258 406 Z" fill="#252b1b" stroke="#c8f135" stroke-width="4.5"/>
    <path d="M256 226 C278 214 322 214 344 226" fill="none" stroke="#f1f1ec" stroke-width="2.5" stroke-dasharray="6 5"/>
    <!-- Woven Brand Label Spotlighted Inside Collar -->
    <rect x="262" y="252" width="76" height="44" rx="7" fill="#f7f7f4" stroke="#c8f135" stroke-width="3.5"/>
    <line x1="278" y1="269" x2="322" y2="269" stroke="#0a0a0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="286" y1="282" x2="314" y2="282" stroke="#666660" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Mannequin Stand Below -->
  <line x1="300" y1="614" x2="300" y2="704" stroke="#7c7c77" stroke-width="7"/>
  <line x1="232" y1="708" x2="368" y2="708" stroke="#7c7c77" stroke-width="5" stroke-linecap="round"/>

  <!-- Pure Vector Camera on Locked Tripod Emblem (Same Tripod Height) -->
  <g transform="translate(442,588)">
    <rect x="0" y="0" width="130" height="130" rx="22" fill="#171914" stroke="#c8f135" stroke-width="3"/>
    <rect x="27" y="24" width="76" height="48" rx="10" fill="#101013" stroke="#c8f135" stroke-width="3"/>
    <circle cx="65" cy="48" r="14" fill="none" stroke="#c8f135" stroke-width="3"/>
    <circle cx="65" cy="48" r="5" fill="#c8f135"/>
    <line x1="65" y1="72" x2="40" y2="112" stroke="#b0b0a8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="65" y1="72" x2="65" y2="114" stroke="#b0b0a8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="65" y1="72" x2="90" y2="112" stroke="#b0b0a8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="110" cy="20" r="15" fill="#c8f135"/>
    <polyline points="103,20 108,25 117,15" fill="none" stroke="#0a0a0b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>