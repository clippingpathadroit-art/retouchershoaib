<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" role="img" aria-label="Step 1 studio setup diagram showing locked tripod height, even softbox light, and garment styled on mannequin bust">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17171b"/>
      <stop offset="100%" stop-color="#0d0d10"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.22" r="0.7">
      <stop offset="0%" stop-color="#c8f135" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c8f135" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg1)"/>
  <rect width="600" height="750" fill="url(#glow1)"/>

  <!-- Technical Grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5">
    <line x1="0" y1="187" x2="600" y2="187"/>
    <line x1="0" y1="375" x2="600" y2="375"/>
    <line x1="0" y1="562" x2="600" y2="562"/>
    <line x1="150" y1="0" x2="150" y2="750"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="450" y1="0" x2="450" y2="750"/>
  </g>

  <!-- Large Legible Step Badge -->
  <rect x="28" y="28" width="224" height="60" rx="30" fill="#c8f135" fill-opacity="0.14" stroke="#c8f135" stroke-width="2.5"/>
  <text x="140" y="71" text-anchor="middle" fill="#c8f135" font-family="'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="1">SHOT 01</text>

  <!-- Softbox Studio Light Top-Left -->
  <g transform="translate(36,122)">
    <polygon points="0,18 72,0 88,82 16,100" fill="#23232a" stroke="#b0b0a8" stroke-width="3"/>
    <polygon points="72,4 88,78 102,72 86,8" fill="#f1f1ec" fill-opacity="0.92"/>
    <line x1="108" y1="34" x2="192" y2="88" stroke="#c8f135" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="104" y1="62" x2="188" y2="150" stroke="#c8f135" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="8 6"/>
  </g>

  <!-- Mannequin Bust & Neckpiece Present -->
  <path d="M254 156 C254 132 346 132 346 156 L354 234 L246 234 Z" fill="#282832" stroke="#b0b0a8" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="288" y="108" width="24" height="32" rx="5" fill="#2e2e38" stroke="#b0b0a8" stroke-width="2.5"/>

  <!-- Garment Exterior Stylized Jacket on Bust -->
  <g>
    <path d="M248 220 L138 260 L92 554 L156 562 L188 358 L188 614 L290 614 L300 584 L310 614 L412 614 L412 358 L444 562 L508 554 L462 260 L352 220 C328 238 272 238 248 220 Z" fill="#1e212b" stroke="#f1f1ec" stroke-width="4" stroke-linejoin="round"/>
    <!-- Lapels & Placket Highlight -->
    <polyline points="248,220 282,390 300,406 318,390 352,220" fill="none" stroke="#c8f135" stroke-width="3.5" stroke-opacity="0.9"/>
    <polyline points="242,248 272,314 254,324 286,388" fill="none" stroke="#a6a69e" stroke-width="2.5"/>
    <polyline points="358,248 328,314 346,324 314,388" fill="none" stroke="#a6a69e" stroke-width="2.5"/>
    <!-- Vertical Placket Symmetry Axis -->
    <line x1="300" y1="230" x2="300" y2="594" stroke="#c8f135" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="9 6"/>
    <!-- Buttons Centered -->
    <circle cx="300" cy="430" r="8" fill="#c8f135"/>
    <circle cx="300" cy="492" r="8" fill="#c8f135"/>
    <!-- Pockets -->
    <line x1="208" y1="496" x2="268" y2="496" stroke="#a6a69e" stroke-width="3.5"/>
    <line x1="332" y1="496" x2="392" y2="496" stroke="#a6a69e" stroke-width="3.5"/>
  </g>

  <!-- Mannequin Stand Below -->
  <line x1="300" y1="614" x2="300" y2="704" stroke="#95958f" stroke-width="7"/>
  <line x1="232" y1="708" x2="368" y2="708" stroke="#95958f" stroke-width="5" stroke-linecap="round"/>

  <!-- Pure Vector Camera on Locked Tripod Emblem (Zero Tiny Text) -->
  <g transform="translate(442,588)">
    <rect x="0" y="0" width="130" height="130" rx="22" fill="#171914" stroke="#c8f135" stroke-width="3"/>
    <rect x="27" y="24" width="76" height="48" rx="10" fill="#101013" stroke="#c8f135" stroke-width="3"/>
    <circle cx="65" cy="48" r="14" fill="none" stroke="#c8f135" stroke-width="3"/>
    <circle cx="65" cy="48" r="5" fill="#c8f135"/>
    <line x1="65" y1="72" x2="40" y2="112" stroke="#b0b0a8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="65" y1="72" x2="65" y2="114" stroke="#b0b0a8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="65" y1="72" x2="90" y2="112" stroke="#b0b0a8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="110" cy="20" r="15" fill="#c8f135"/>
    <polyline points="103,20 108,25 117,15" fill="none" stroke="#0a0a0b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>