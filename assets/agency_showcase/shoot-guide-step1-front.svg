<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" role="img" aria-label="Step 1 studio setup diagram showing locked tripod height, even softbox light, and garment styled on mannequin bust">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17171b"/>
      <stop offset="100%" stop-color="#0d0d10"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.22" r="0.7">
      <stop offset="0%" stop-color="#c8f135" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c8f135" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg1)"/>
  <rect width="600" height="750" fill="url(#glow1)"/>

  <!-- Technical Grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5">
    <line x1="0" y1="187" x2="600" y2="187"/>
    <line x1="0" y1="375" x2="600" y2="375"/>
    <line x1="0" y1="562" x2="600" y2="562"/>
    <line x1="150" y1="0" x2="150" y2="750"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="450" y1="0" x2="450" y2="750"/>
  </g>

  <!-- Large Step Badge -->
  <rect x="28" y="26" width="236" height="48" rx="24" fill="#c8f135" fill-opacity="0.14" stroke="#c8f135" stroke-width="2"/>
  <text x="146" y="57" text-anchor="middle" fill="#c8f135" font-family="'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="1.2">STEP 01 · SHOT 1</text>

  <!-- Softbox Studio Light Top-Left -->
  <g transform="translate(36,112)">
    <polygon points="0,18 68,0 82,78 14,96" fill="#23232a" stroke="#b0b0a8" stroke-width="2.5"/>
    <polygon points="68,4 82,74 94,68 80,8" fill="#f1f1ec" fill-opacity="0.9"/>
    <line x1="100" y1="32" x2="186" y2="86" stroke="#c8f135" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="7 6"/>
    <line x1="96" y1="58" x2="182" y2="146" stroke="#c8f135" stroke-opacity="0.4" stroke-width="2.5" stroke-dasharray="7 6"/>
  </g>

  <!-- Mannequin Bust & Neckpiece Present -->
  <path d="M254 148 C254 124 346 124 346 148 L354 226 L246 226 Z" fill="#282832" stroke="#b0b0a8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="288" y="102" width="24" height="30" rx="5" fill="#2e2e38" stroke="#b0b0a8" stroke-width="2"/>

  <!-- Garment Exterior Stylized Jacket on Bust -->
  <g>
    <path d="M248 214 L142 252 L98 544 L158 552 L188 352 L188 606 L290 606 L300 578 L310 606 L412 606 L412 352 L442 552 L502 544 L458 252 L352 214 C328 232 272 232 248 214 Z" fill="#1e212b" stroke="#f1f1ec" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Lapels & Placket Highlight -->
    <polyline points="248,214 282,384 300,400 318,384 352,214" fill="none" stroke="#c8f135" stroke-width="3" stroke-opacity="0.85"/>
    <polyline points="242,240 272,306 254,316 286,382" fill="none" stroke="#a6a69e" stroke-width="2"/>
    <polyline points="358,240 328,306 346,316 314,382" fill="none" stroke="#a6a69e" stroke-width="2"/>
    <!-- Vertical Placket Symmetry Axis -->
    <line x1="300" y1="224" x2="300" y2="588" stroke="#c8f135" stroke-opacity="0.65" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- Buttons Centered -->
    <circle cx="300" cy="422" r="7" fill="#c8f135"/>
    <circle cx="300" cy="484" r="7" fill="#c8f135"/>
    <!-- Pockets -->
    <line x1="208" y1="488" x2="268" y2="488" stroke="#a6a69e" stroke-width="3"/>
    <line x1="332" y1="488" x2="392" y2="488" stroke="#a6a69e" stroke-width="3"/>
  </g>

  <!-- Mannequin Stand Below -->
  <line x1="300" y1="606" x2="300" y2="698" stroke="#95958f" stroke-width="6"/>
  <line x1="234" y1="702" x2="366" y2="702" stroke="#95958f" stroke-width="4" stroke-linecap="round"/>

  <!-- Locked Camera / Tripod Badge Bottom-Right -->
  <g transform="translate(432,576)">
    <rect x="0" y="0" width="142" height="142" rx="18" fill="#171914" stroke="#c8f135" stroke-width="2.5"/>
    <rect x="35" y="28" width="72" height="44" rx="8" fill="#101013" stroke="#c8f135" stroke-width="2.5"/>
    <circle cx="71" cy="50" r="12" fill="none" stroke="#c8f135" stroke-width="2.5"/>
    <line x1="71" y1="72" x2="50" y2="108" stroke="#a6a69e" stroke-width="2.5"/>
    <line x1="71" y1="72" x2="71" y2="112" stroke="#a6a69e" stroke-width="2.5"/>
    <line x1="71" y1="72" x2="92" y2="108" stroke="#a6a69e" stroke-width="2.5"/>
    <text x="71" y="130" text-anchor="middle" fill="#c8f135" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800">TRIPOD LOCKED</text>
  </g>
</svg>
