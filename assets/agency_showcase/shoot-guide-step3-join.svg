<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" role="img" aria-label="Step 3 completed ghost mannequin composite diagram showing combined Shot 1 exterior and Shot 2 3D hollow neck join on pure white studio background with hand-drawn Pen Tool path">
